<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nome Games – Turnering</title>
    <script>
      try {
        const stored = localStorage.getItem('nome-tema')
        const lang = localStorage.getItem('nome-sprak') === 'en' ? 'en' : 'no'
        document.documentElement.lang = lang
        document.title = lang === 'en' ? 'Nome Games – Tournament' : 'Nome Games – Turnering'
        const dark = stored ? stored === 'on' || stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('dramatic', localStorage.getItem('nome-dramatisk') === 'on')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
